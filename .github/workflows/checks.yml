name: Browser module checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/*.test.mjs
      - run: git diff --check
