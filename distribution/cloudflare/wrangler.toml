name = "scan2work"
main = "proxy.mjs"
compatibility_date = "2026-11-07"
workers_dev = true
routes = [{pattern = "scan2work.app", custom_domain = true}]

[vars]
ORIGIN = "http://v2202609409444511285.goodsrv.de:20229"
# Voice assistant (off until the host runs it): the public port Caddy maps to mcp_server.py, and "1" to let the
# viewer's job card save checks and notes. See distribution/host/README.md.
# MCP_ORIGIN = "http://v2202609409444511285.goodsrv.de:<public MCP port>"
# ASSISTANT = "1"

[env.review]
name = "scan2work-review"
routes = [{pattern = "review.scan2work.app", custom_domain = true}]
workers_dev = true

[env.review.vars]
ORIGIN = "http://v2202609409444511285.goodsrv.de:20250"
