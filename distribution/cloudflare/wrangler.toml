name = "scan2work"
main = "proxy.mjs"
compatibility_date = "2026-11-07"
workers_dev = true
routes = [{pattern = "scan2work.app", custom_domain = true}]

[vars]
ORIGIN = "http://v2202609409444511285.goodsrv.de:20229"
# Separate encrypted MCP transport; update if its supervised quick tunnel restarts.
MCP_ORIGIN = "https://student-leather-designing-recommended.trycloudflare.com"
# Main demo explicitly enables shared jobs and the Arduino fault panel.
# Keep these aligned with the baseline/MCP host flags; review remains read-only.
ASSISTANT = "1"
ARDUINO = "1"
ARDUINO_ORIGIN = "https://protect-fill-hanging-important.trycloudflare.com"

[env.review]
name = "scan2work-review"
routes = [{pattern = "review.scan2work.app", custom_domain = true}]
workers_dev = true

[env.review.vars]
ORIGIN = "http://v2202609409444511285.goodsrv.de:20250"
