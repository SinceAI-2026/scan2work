[program:scan2work-board-tunnel]
environment=PROC_NAME="scan2work-board-tunnel"
command=/bin/bash /workspace/scan2work/deploy/board-tunnel.sh
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
