# Replace MCP_CODE_SNAPSHOT with /workspace/scan2work/services/mcp-<commit>.
# These are new programs; no existing management or web program is modified.
[program:scan2work-mcp]
environment=PROC_NAME="scan2work-mcp",SCAN2WORK_MCP_CODE="MCP_CODE_SNAPSHOT"
command=/bin/bash /workspace/scan2work/deploy/mcp-service.sh server
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0

[program:scan2work-mcp-tunnel]
environment=PROC_NAME="scan2work-mcp-tunnel"
command=/bin/bash /workspace/scan2work/deploy/mcp-service.sh tunnel
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
