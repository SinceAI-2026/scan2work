[program:scan2work-baseline]
environment=PROC_NAME="scan2work-baseline"
command=/bin/bash /workspace/scan2work/deploy/run-service.sh baseline
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

